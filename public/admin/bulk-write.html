<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>플로릭스 스튜디오 - 빠른 작성</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans KR', 'Inter', sans-serif;
      background: #FAFAF8;
      color: #1A1A1A;
      min-height: 100vh;
      padding: 24px;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid #E5E5E0;
      margin-bottom: 32px;
    }
    .header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .header-actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .btn-primary {
      background: #1A1A1A;
      color: #FAFAF8;
    }
    .btn-primary:hover { background: #B8956A; }
    .btn-secondary {
      background: transparent;
      color: #666;
      border: 1px solid #E5E5E0;
    }
    .btn-secondary:hover { background: #F0F0EB; }
    .meta-section {
      background: white;
      padding: 24px;
      border-radius: 8px;
      margin-bottom: 24px;
      border: 1px solid #E5E5E0;
    }
    .meta-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field label {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      letter-spacing: 0.05em;
    }
    .field input, .field select, .field textarea {
      padding: 10px 12px;
      border: 1px solid #E5E5E0;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
      background: #FAFAF8;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      outline: none;
      border-color: #B8956A;
    }
    .drop-zone {
      border: 2px dashed #D5D5D0;
      border-radius: 12px;
      padding: 48px 24px;
      text-align: center;
      background: white;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 24px;
    }
    .drop-zone:hover, .drop-zone.dragging {
      border-color: #B8956A;
      background: #FFF8F0;
    }
    .drop-zone-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }
    .drop-zone p {
      font-size: 14px;
      color: #666;
    }
    .drop-zone strong {
      color: #1A1A1A;
      font-weight: 700;
    }
    .status {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
      display: none;
    }
    .status.show { display: block; }
    .status.info { background: #E8F0FE; color: #1A56DB; }
    .status.success { background: #E8F5E9; color: #2E7D32; }
    .status.error { background: #FEE; color: #C62828; }
    .login-card {
      background: white;
      padding: 48px;
      border-radius: 12px;
      text-align: center;
      border: 1px solid #E5E5E0;
    }
    .login-card h2 {
      font-size: 20px;
      margin-bottom: 12px;
    }
    .login-card p {
      color: #666;
      margin-bottom: 24px;
      font-size: 14px;
    }
    .blocks-area {
      min-height: 200px;
    }
    .empty-state {
      text-align: center;
      padding: 64px 24px;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>빠른 작성 — 시공 사례</h1>
      <div class="header-actions">
        <a href="/admin/" class="btn btn-secondary">기존 CMS로</a>
        <button class="btn btn-primary" id="publishBtn" disabled>발행</button>
      </div>
    </div>

    <div id="loginGate" class="login-card">
      <h2>로그인이 필요합니다</h2>
      <p>먼저 기존 CMS에 로그인한 뒤 이 페이지로 돌아오세요.</p>
      <a href="/admin/" class="btn btn-primary">CMS로 이동해서 로그인</a>
    </div>

    <div id="editor" style="display: none;">
      <div id="status" class="status"></div>

      <div class="meta-section">
        <div class="meta-grid">
          <div class="field">
            <label>제목</label>
            <input type="text" id="title" placeholder="예: 강남 카페 시공">
          </div>
          <div class="field">
            <label>지역</label>
            <input type="text" id="location" placeholder="예: 서울 강남구">
          </div>
          <div class="field">
            <label>공간 종류</label>
            <select id="category">
              <option value="주거">주거</option>
              <option value="카페">카페</option>
              <option value="상업공간" selected>상업공간</option>
              <option value="사무공간">사무공간</option>
              <option value="기타">기타</option>
            </select>
          </div>
          <div class="field">
            <label>시공일</label>
            <input type="date" id="date">
          </div>
          <div class="field">
            <label>면적 (㎡, 선택)</label>
            <input type="number" id="area" placeholder="예: 48">
          </div>
          <div class="field">
            <label>시공 소요시간</label>
            <input type="text" id="duration" value="1일 완공">
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label>사용 컬러/규사 (선택)</label>
            <input type="text" id="specs" placeholder="예: 베이지 톤 / 중간 규사 / 매트 마감">
          </div>
        </div>
      </div>

      <div class="drop-zone" id="dropZone">
        <div class="drop-zone-icon">📷</div>
        <p><strong>여기에 사진을 드래그</strong>하거나 클릭해서 선택하세요</p>
        <p style="margin-top: 8px; font-size: 12px;">한 번에 여러 장 가능 · JPG, PNG, WEBP</p>
        <input type="file" id="fileInput" multiple accept="image/*" style="display: none;">
      </div>

      <div class="blocks-area" id="blocksArea">
        <div class="empty-state">
          사진을 추가하면 여기에 블록이 나타납니다.<br>
          텍스트 블록과 사진 블록을 자유롭게 배치하세요.
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1단계: 로그인 상태 확인만
    const TOKEN_KEY = 'decap-cms-user';
    
    function checkLogin() {
      try {
        const stored = localStorage.getItem(TOKEN_KEY) || localStorage.getItem('netlify-cms-user');
        if (stored) {
          const user = JSON.parse(stored);
          if (user.token) {
            return user.token;
          }
        }
        // 다른 키 패턴들도 확인
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key && (key.includes('cms-user') || key.includes('gotrue'))) {
            try {
              const val = JSON.parse(localStorage.getItem(key));
              if (val.token) return val.token;
            } catch (e) {}
          }
        }
      } catch (e) {
        console.error('Token check failed:', e);
      }
      return null;
    }

    const token = checkLogin();
    if (token) {
      document.getElementById('loginGate').style.display = 'none';
      document.getElementById('editor').style.display = 'block';
      document.getElementById('publishBtn').disabled = false;
      
      // 오늘 날짜 기본값
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('date').value = today;
      
      showStatus('info', '로그인 확인됨. 사진을 드래그하거나 글을 작성해보세요.');
    }

    function showStatus(type, message) {
      const el = document.getElementById('status');
      el.className = 'status show ' + type;
      el.textContent = message;
    }

    // 드롭존 기본 동작 (1단계: 아직 업로드 안 함, UI만 확인)
    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    
    dropZone.addEventListener('click', () => fileInput.click());
    
    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('dragging');
    });
    
    dropZone.addEventListener('dragleave', () => {
      dropZone.classList.remove('dragging');
    });
    
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('dragging');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      showStatus('info', files.length + '장 인식됨. 2단계에서 실제 업로드 기능이 추가됩니다.');
    });
    
    fileInput.addEventListener('change', (e) => {
      const files = Array.from(e.target.files);
      showStatus('info', files.length + '장 인식됨. 2단계에서 실제 업로드 기능이 추가됩니다.');
    });
  </script>
</body>
</html>
