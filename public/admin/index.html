<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>플로릭스 스튜디오 - 관리자</title>
  <link rel="icon" href="data:," />
  <style>
    body { margin: 0; font-family: 'Noto Sans KR', sans-serif; }
    
    /* 빠른 작성 버튼 (FAB 스타일) */
    .florix-quick-write-btn {
      position: fixed;
      top: 14px;
      right: 200px;
      z-index: 9999;
      background: linear-gradient(135deg, #1A1A1A 0%, #B8956A 100%);
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      border: none;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-family: inherit;
      text-decoration: none;
    }
    .florix-quick-write-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(184, 149, 106, 0.4);
    }
    .florix-quick-write-btn .icon { font-size: 14px; }

    /* 리다이렉트 안내 카드 */
    .florix-redirect-card {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .florix-redirect-card .inner {
      background: white;
      border-radius: 12px;
      padding: 32px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    .florix-redirect-card h2 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #1A1A1A;
    }
    .florix-redirect-card .badge {
      display: inline-block;
      background: linear-gradient(135deg, #1A1A1A 0%, #B8956A 100%);
      color: white;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .florix-redirect-card p {
      color: #666;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 24px;
    }
    .florix-redirect-card .actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .florix-redirect-card button, .florix-redirect-card a {
      padding: 12px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      border: none;
      font-family: inherit;
      transition: all 0.15s;
    }
    .florix-redirect-card .btn-primary {
      background: #1A1A1A;
      color: white;
    }
    .florix-redirect-card .btn-primary:hover {
      background: #B8956A;
    }
    .florix-redirect-card .btn-secondary {
      background: transparent;
      color: #666;
      border: 1px solid #E5E5E0;
    }
    .florix-redirect-card .btn-secondary:hover {
      background: #F0F0EB;
    }
    .florix-redirect-card .countdown {
      font-size: 12px;
      color: #999;
      margin-top: 12px;
    }

    /* 모바일 대응 */
    @media (max-width: 768px) {
      .florix-quick-write-btn {
        right: 60px;
        top: 12px;
        padding: 6px 10px;
        font-size: 12px;
      }
      .florix-quick-write-btn .label-long { display: none; }
    }
  </style>
</head>
<body>
  <script>
    /**
     * 플로릭스 CMS 통합 스크립트
     * 1. 시공 사례 컬렉션 클릭 시 → 빠른 작성으로 리다이렉트 안내
     * 2. CMS 상단에 "빠른 작성" 버튼 자동 삽입
     */

    // ==================== Decap CMS 로드 ====================
    const cmsScript = document.createElement('script');
    cmsScript.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
    document.head.appendChild(cmsScript);

    // ==================== 통합 스크립트 ====================
    let buttonInserted = false;
    let redirectShownThisSession = false;
    
    // 세션 스토리지로 "이번 세션에서 이미 리다이렉트 안내 봤는지" 체크
    const REDIRECT_SHOWN_KEY = 'florix-redirect-shown';
    const SKIP_REDIRECT_KEY = 'florix-skip-redirect';

    // === 1. CMS 상단에 빠른 작성 버튼 삽입 ===
    function insertQuickWriteButton() {
      if (buttonInserted) return;
      if (document.querySelector('.florix-quick-write-btn')) {
        buttonInserted = true;
        return;
      }
      // CMS UI가 로드되었는지 확인 (헤더 영역)
      const cmsHeader = document.querySelector('header') || document.querySelector('[class*="Header"]') || document.querySelector('[class*="AppHeader"]');
      if (!cmsHeader && !document.body.querySelector('div')) return;

      const btn = document.createElement('a');
      btn.className = 'florix-quick-write-btn';
      btn.href = '/admin/bulk-write';
      btn.innerHTML = '<span class="icon">⚡</span><span><span class="label-long">빠른 </span>작성</span>';
      btn.title = '시공 사례 빠른 작성 (드래그앤드롭, 자동저장 지원)';
      document.body.appendChild(btn);
      buttonInserted = true;
    }

    // === 2. 시공 사례 컬렉션 진입 시 리다이렉트 안내 ===
    function checkAndRedirect() {
      const hash = window.location.hash || '';
      
      // /admin/#/collections/works/new 또는 /admin/#/collections/works 진입 시
      const isWorksNew = hash.includes('/collections/works/new');
      const isWorksList = hash === '#/collections/works' || hash.endsWith('/collections/works/');
      
      // "이번 세션에 안 보여주기" 또는 이미 봤으면 패스
      if (sessionStorage.getItem(SKIP_REDIRECT_KEY) === '1') return;
      if (sessionStorage.getItem(REDIRECT_SHOWN_KEY) === '1') return;
      
      if (isWorksNew) {
        showRedirectCard('new');
      }
    }

    function showRedirectCard(mode) {
      // 이미 카드가 있으면 무시
      if (document.querySelector('.florix-redirect-card')) return;
      
      sessionStorage.setItem(REDIRECT_SHOWN_KEY, '1');
      
      const card = document.createElement('div');
      card.className = 'florix-redirect-card';
      card.innerHTML = `
        <div class="inner">
          <div class="badge">⚡ FLORIX QUICK WRITE</div>
          <h2>빠른 작성으로 가시겠어요?</h2>
          <p>
            <strong>새 빠른 작성 페이지</strong>는 사진 드래그앤드롭, 자동 저장,<br>
            모바일 지원까지 모두 됩니다.<br>
            훨씬 편하게 글을 쓸 수 있어요.
          </p>
          <div class="actions">
            <button class="btn-secondary" id="florix-stay-here">여기서 작성</button>
            <a class="btn-primary" href="/admin/bulk-write">빠른 작성으로 →</a>
          </div>
          <div class="countdown" id="florix-countdown">5초 후 빠른 작성으로 자동 이동합니다...</div>
        </div>
      `;
      document.body.appendChild(card);

      // "여기서 작성" 클릭 시 - 이번 세션 동안 다시 묻지 않음
      document.getElementById('florix-stay-here').addEventListener('click', function() {
        sessionStorage.setItem(SKIP_REDIRECT_KEY, '1');
        card.remove();
        clearInterval(countdownTimer);
      });

      // 5초 카운트다운
      let remaining = 5;
      const countdownEl = document.getElementById('florix-countdown');
      const countdownTimer = setInterval(function() {
        remaining--;
        if (remaining <= 0) {
          clearInterval(countdownTimer);
          window.location.href = '/admin/bulk-write';
        } else {
          countdownEl.textContent = remaining + '초 후 빠른 작성으로 자동 이동합니다...';
        }
      }, 1000);

      // 카드가 제거되면 카운트다운 중지
      const observer = new MutationObserver(function() {
        if (!document.body.contains(card)) {
          clearInterval(countdownTimer);
          observer.disconnect();
        }
      });
      observer.observe(document.body, { childList: true });
    }

    // === 3. 초기화 + 감시 ===
    function initIntegration() {
      // CMS가 로드될 때까지 대기
      const checkInterval = setInterval(function() {
        if (window.CMS || document.querySelector('header') || document.querySelector('[class*="App"]')) {
          insertQuickWriteButton();
          checkAndRedirect();
          
          // CMS 내부 라우팅 감지 (해시 변경)
          window.addEventListener('hashchange', function() {
            insertQuickWriteButton();
            checkAndRedirect();
          });
          
          // CMS DOM 변경 감시 (버튼이 사라지면 다시 삽입)
          const observer = new MutationObserver(function() {
            if (!document.querySelector('.florix-quick-write-btn')) {
              buttonInserted = false;
              insertQuickWriteButton();
            }
          });
          observer.observe(document.body, { childList: true, subtree: false });
          
          clearInterval(checkInterval);
        }
      }, 500);
      
      // 안전장치: 10초 후에도 못 찾으면 그냥 삽입
      setTimeout(function() {
        clearInterval(checkInterval);
        insertQuickWriteButton();
        checkAndRedirect();
      }, 10000);
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initIntegration);
    } else {
      initIntegration();
    }
  </script>
</body>
</html>
